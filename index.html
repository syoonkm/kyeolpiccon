<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>벚꽃 사진 콘테스트 투표</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cherry: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fdf2f8; }
        ::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f472b6; }
        
        /* 선택된 카드 스타일링 */
        .selected-card {
            border-color: #ec4899 !important;
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.2);
            background-color: #fdf2f8;
        }
        
        .disabled-card {
            opacity: 0.5;
            filter: grayscale(100%);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-cherry-50 text-gray-800 font-sans min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-center">
            <div class="flex items-center space-x-2">
                <i data-lucide="flower-2" class="text-cherry-500 w-8 h-8"></i>
                <h1 class="text-xl md:text-2xl font-bold text-cherry-700 tracking-tight">봄빛 벚꽃 사진전</h1>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-12">
        
        <!-- 소개 및 규칙 -->
        <section class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-cherry-100">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">📸 온라인 투표 안내</h2>
            <ul class="list-disc pl-5 space-y-2 text-gray-600">
                <li><strong class="text-cherry-600">반별 사진:</strong> 가장 마음에 드는 사진 <strong>1장</strong>에 투표해주세요. (본인 소속 반은 투표 불가)</li>
                <li><strong class="text-cherry-600">개인별 사진:</strong> 가장 마음에 드는 사진 <strong>3장</strong>에 투표해주세요. (본인 사진은 투표 불가)</li>
                <li>학번과 이름을 정확히 입력해야 투표가 인정됩니다.</li>
            </ul>
        </section>

        <!-- 참가자 정보 입력 -->
        <section class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-cherry-100" id="userInfoSection">
            <h2 class="text-xl font-bold mb-4 flex items-center">
                <i data-lucide="user" class="w-5 h-5 mr-2 text-cherry-500"></i> 내 정보 입력
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">학번 (5자리 숫자)</label>
                    <input type="text" id="studentId" placeholder="예: 10101" maxlength="5" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cherry-400 focus:border-cherry-400 outline-none transition" oninput="handleUserInfoChange()">
                    <p class="text-xs text-gray-500 mt-1" id="classInfoText">학번을 입력하면 본인 반/사진이 자동으로 투표에서 제외됩니다.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">이름</label>
                    <input type="text" id="studentName" placeholder="예: 홍길동" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cherry-400 focus:border-cherry-400 outline-none transition" oninput="handleUserInfoChange()">
                </div>
            </div>
        </section>

        <!-- 반별 사진 -->
        <section>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold flex items-center">
                    <i data-lucide="users" class="w-6 h-6 mr-2 text-cherry-500"></i> 반별 사진
                </h2>
                <span class="bg-cherry-100 text-cherry-700 text-sm font-bold px-3 py-1 rounded-full" id="classVoteStatus">0 / 1 선택됨</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8" id="classPhotosContainer">
                <!-- 반별 사진 렌더링 영역 -->
            </div>
        </section>

        <!-- 개인별 사진 -->
        <section>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold flex items-center">
                    <i data-lucide="camera" class="w-6 h-6 mr-2 text-cherry-500"></i> 개인별 사진
                </h2>
                <span class="bg-cherry-100 text-cherry-700 text-sm font-bold px-3 py-1 rounded-full" id="indivVoteStatus">0 / 3 선택됨</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-8 md:gap-10 lg:gap-12" id="individualPhotosContainer">
                <!-- 개인별 사진 렌더링 영역 -->
            </div>
        </section>

        <!-- 제출 버튼 -->
        <div class="text-center pt-8 pb-12">
            <button onclick="submitVote()" id="submitBtn" class="bg-cherry-500 hover:bg-cherry-600 text-white font-bold py-4 px-12 rounded-full text-lg shadow-lg hover:shadow-xl transition transform hover:-translate-y-1 w-full md:w-auto">
                투표 제출하기
            </button>
        </div>

    </main>

    <!-- 커스텀 모달 (메시지 박스) -->
    <div id="customModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="text-center">
                <div id="modalIcon" class="mx-auto w-16 h-16 mb-4 flex items-center justify-center rounded-full bg-cherry-100 text-cherry-500">
                    <i data-lucide="info" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-2" id="modalTitle">알림</h3>
                <p class="text-gray-600 mb-6" id="modalMessage">메시지 내용</p>
                <button onclick="closeModal()" class="w-full bg-cherry-500 hover:bg-cherry-600 text-white font-bold py-3 px-4 rounded-xl transition">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. 필요한 모든 Firebase 기능 불러오기
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 2. 선생님의 Firebase 설정 적용
        const firebaseConfig = {
            apiKey: "AIzaSyBjF3Kvm5d-MWZaG1uUxNPZJyt6l9GUpSg",
            authDomain: "kyeolpiccon.firebaseapp.com",
            projectId: "kyeolpiccon",
            storageBucket: "kyeolpiccon.firebasestorage.app",
            messagingSenderId: "18744378616",
            appId: "1:18744378616:web:a2834cca00965c544f270d",
            measurementId: "G-EY91TGCYWV"
        };

        // 3. Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        // 투표 데이터 저장 경로 설정
        function getVotesCollectionRef() {
            return collection(db, 'votes');
        }
        function getVoteDocRef(studentId) {
            return doc(db, 'votes', studentId);
        }

        // 인증 초기화 (익명 로그인)
        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("인증 에러:", error);
            }
        }
        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
        });

        // Lucide 아이콘 초기화
        lucide.createIcons();

        // ------------------ 데이터 정의 ------------------
        const classPhotos = [
            { id: '1-1', ext: 'jpeg' },
            { id: '1-2', ext: 'jpeg' },
            { id: '2-1', ext: 'png' },
            { id: '2-2', ext: 'jpeg' },
            { id: '2-3', ext: 'jpeg' }
        ];

        const individualPhotos = [
            { id: '10101', yt: 'jRBh7oYkNmI', lyrics: '너랑 있으면 온 세상이 특별해' },
            { id: '10102', yt: '1xL-GRBUNCw', lyrics: 'Ain’t it just so easy to say' },
            { id: '10104', yt: 'FkO8ub83wss', lyrics: '絶叫な感情落下 パッパラノーイ「ア」' },
            { id: '10105', yt: 'vORDkdgLzEs', lyrics: '' },
            { id: '10202', yt: 'B4c_SkROzzo', lyrics: '' },
            { id: '10203', yt: 'k3-BDy55tq4', lyrics: '' },
            { id: '10205', yt: '', lyrics: '' },
            { id: '20102', yt: '', lyrics: '' },
            { id: '20201', yt: '87Eaq-dQIcI', lyrics: '' },
            { id: '20202', yt: 'osdysFalds4', lyrics: '거긴 벌써 봄이왔군요 하지만 내고향 서울엔 아직 눈이와요' },
            { id: '20204', yt: 'h_D3VFfhvs4', lyrics: 'You’ve been hit by a smooth criminal' },
            { id: '20206', yt: 'y5MAgMVwfFs', lyrics: '그날 넌 내가 좋다고 했어' },
            { id: '20303', yt: 'ony539T074w', lyrics: '' },
            { id: '20304', yt: 'ouR4nn1G9r4', lyrics: '' },
            { id: '20305', yt: 'UwZv5jjPaBE', lyrics: '너와 날 사랑쪽지에 다 담아서 텅 빈 하늘에 올리면 바람도 우릴 감쌀거야' },
            { id: '20306', yt: 'pNi9PjmbUrI', lyrics: '푸른 낭만을 선물할게', ext: 'png' }
        ];

        // ------------------ 상태 관리 ------------------
        let state = {
            studentId: '',
            name: '',
            userClass: '', // 예: '1-1'
            selectedClassId: null,
            selectedIndivIds: []
        };

        // ------------------ UI 렌더링 ------------------
        function initApp() {
            renderClassPhotos();
            renderIndividualPhotos();
        }

        // 존재하지 않는 이미지에 대한 Placeholder 대체 함수
        function getFallbackImg(text) {
            return `https://placehold.co/600x400/fbcfe8/be185d?text=${encodeURIComponent(text)}`;
        }

        function renderClassPhotos() {
            const container = document.getElementById('classPhotosContainer');
            container.innerHTML = '';

            classPhotos.forEach(photo => {
                const isSelected = state.selectedClassId === photo.id;
                const isDisabled = state.userClass === photo.id; // 본인 반 제외
                
                const card = document.createElement('div');
                card.className = `bg-white rounded-xl overflow-hidden border-2 transition-all duration-200 cursor-pointer 
                                  ${isSelected ? 'selected-card' : 'border-gray-200 hover:border-cherry-300 shadow-md hover:shadow-lg'}
                                  ${isDisabled ? 'disabled-card' : ''}`;
                
                // 클릭 이벤트 (비활성화 상태가 아닐 때만)
                if (!isDisabled) {
                    card.onclick = () => selectClassPhoto(photo.id);
                }

                card.innerHTML = `
                    <div class="relative aspect-video bg-gray-100">
                        <img src="images/${photo.id}.${photo.ext}" 
                             onerror="this.onerror=null; this.src='${getFallbackImg('반별 사진 ' + photo.id)}';" 
                             alt="${photo.id} 반 사진" 
                             class="w-full h-full object-cover">
                        ${isDisabled ? '<div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center text-white font-bold text-lg backdrop-blur-sm">본인 반 투표 불가</div>' : ''}
                        ${isSelected ? '<div class="absolute top-3 right-3 bg-cherry-500 text-white rounded-full p-1"><i data-lucide="check" class="w-5 h-5"></i></div>' : ''}
                    </div>
                    <div class="p-4 text-center">
                        <h3 class="text-lg font-bold text-gray-800">${photo.id} 반</h3>
                    </div>
                `;
                container.appendChild(card);
            });
            
            document.getElementById('classVoteStatus').innerText = `${state.selectedClassId ? 1 : 0} / 1 선택됨`;
            lucide.createIcons();
        }

        function renderIndividualPhotos() {
            const container = document.getElementById('individualPhotosContainer');
            container.innerHTML = '';

            individualPhotos.forEach(photo => {
                const isSelected = state.selectedIndivIds.includes(photo.id);
                const isDisabled = state.studentId === photo.id; // 본인 사진 제외
                
                const card = document.createElement('div');
                card.className = `bg-white rounded-xl overflow-hidden border-2 transition-all duration-200 flex flex-col
                                  ${isSelected ? 'selected-card' : 'border-gray-200 hover:border-cherry-300 shadow-md hover:shadow-lg'}
                                  ${isDisabled ? 'disabled-card' : ''}`;

                // 유튜브 임베드 HTML
                let youtubeHtml = '';
                if (photo.yt) {
                    youtubeHtml = `
                        <div class="w-full aspect-video mt-auto border-t border-gray-100">
                            <iframe src="https://www.youtube.com/embed/${photo.yt}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen class="w-full h-full"></iframe>
                        </div>
                    `;
                }

                // 가사 HTML
                let lyricsHtml = '';
                if (photo.lyrics) {
                    lyricsHtml = `
                        <div class="px-5 py-4 bg-cherry-50/50 mt-auto border-t border-gray-100 flex-grow-0">
                            <p class="text-sm text-cherry-800 italic text-center font-medium leading-relaxed">
                                "${photo.lyrics}"
                            </p>
                        </div>
                    `;
                }

                // 확장자가 따로 지정되어 있으면 그것을 쓰고, 없으면 기본값인 'jpeg'를 사용
                const extension = photo.ext || 'jpeg';

                card.innerHTML = `
                    <div class="relative aspect-square bg-gray-100 cursor-pointer" onclick="${isDisabled ? '' : `selectIndividualPhoto('${photo.id}')`}">
                        <img src="images/${photo.id}.${extension}" 
                             onerror="this.onerror=null; this.src='${getFallbackImg('참가자 ' + photo.id)}';" 
                             alt="${photo.id} 사진" 
                             class="w-full h-full object-cover">
                        ${isDisabled ? '<div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center text-white font-bold text-lg backdrop-blur-sm">본인 사진 투표 불가</div>' : ''}
                        
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-gray-800 text-xs font-bold px-2 py-1 rounded shadow-sm">
                            ${photo.id}
                        </div>

                        <div class="absolute top-3 right-3 w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors 
                            ${isSelected ? 'bg-cherry-500 border-cherry-500 text-white' : 'bg-white/80 border-gray-300 text-transparent'}">
                            <i data-lucide="check" class="w-5 h-5"></i>
                        </div>
                    </div>
                    ${lyricsHtml}
                    ${youtubeHtml}
                `;
                container.appendChild(card);
            });

            document.getElementById('indivVoteStatus').innerText = `${state.selectedIndivIds.length} / 3 선택됨`;
            lucide.createIcons();
        }

        // ------------------ 이벤트 핸들러 ------------------
        function handleUserInfoChange() {
            const idInput = document.getElementById('studentId').value.trim();
            state.studentId = idInput;
            state.name = document.getElementById('studentName').value.trim();

            const infoText = document.getElementById('classInfoText');

            if (idInput.length === 5 && !isNaN(idInput)) {
                const grade = idInput.charAt(0);
                const classNum = parseInt(idInput.substring(1, 3), 10);
                state.userClass = `${grade}-${classNum}`;
                infoText.innerHTML = `<span class="text-cherry-600 font-bold">확인됨: ${grade}학년 ${classNum}반.</span> 본인 반과 본인 사진은 투표할 수 없습니다.`;
                
                if (state.selectedClassId === state.userClass) {
                    state.selectedClassId = null;
                }
                if (state.selectedIndivIds.includes(state.studentId)) {
                    state.selectedIndivIds = state.selectedIndivIds.filter(id => id !== state.studentId);
                }
            } else {
                state.userClass = '';
                infoText.innerHTML = "학번 5자리를 정확히 입력해주세요.";
            }

            renderClassPhotos();
            renderIndividualPhotos();
        }

        function selectClassPhoto(id) {
            if(state.userClass === '') {
                showModal('학번 입력 필요', '투표를 위해 먼저 학번 5자리를 정확히 입력해주세요.', 'warning');
                document.getElementById('studentId').focus();
                return;
            }
            if (state.selectedClassId === id) {
                state.selectedClassId = null;
            } else {
                state.selectedClassId = id;
            }
            renderClassPhotos();
        }

        function selectIndividualPhoto(id) {
             if(state.userClass === '') {
                showModal('학번 입력 필요', '투표를 위해 먼저 학번 5자리를 정확히 입력해주세요.', 'warning');
                document.getElementById('studentId').focus();
                return;
            }
            const index = state.selectedIndivIds.indexOf(id);
            if (index > -1) {
                state.selectedIndivIds.splice(index, 1);
            } else {
                if (state.selectedIndivIds.length >= 3) {
                    showModal('개수 초과', '개인별 사진은 최대 3장까지만 투표할 수 있습니다.', 'warning');
                    return;
                }
                state.selectedIndivIds.push(id);
            }
            renderIndividualPhotos();
        }

        // ------------------ 투표 제출 및 다운로드 ------------------
        async function submitVote() {
            if (!currentUser) {
                showModal('연결 중', '데이터베이스에 연결하고 있습니다. 잠시 후 다시 시도해주세요.', 'warning');
                return;
            }
            if (state.studentId.length !== 5 || isNaN(state.studentId)) {
                showModal('입력 오류', '학번 5자리를 정확하게 입력해주세요.', 'error');
                return;
            }
            if (!state.name) {
                showModal('입력 오류', '이름을 입력해주세요.', 'error');
                return;
            }
            if (!state.selectedClassId) {
                showModal('투표 누락', '반별 사진 1장을 선택해주세요.', 'warning');
                return;
            }
            if (state.selectedIndivIds.length !== 3) {
                showModal('투표 부족', `개인별 사진은 3장을 선택해야 합니다. (현재 ${state.selectedIndivIds.length}장 선택)`, 'warning');
                return;
            }

            const voteData = {
                studentId: state.studentId,
                name: state.name,
                classVote: state.selectedClassId,
                individualVotes: state.selectedIndivIds,
                timestamp: new Date().toISOString()
            };

            try {
                const voteRef = getVoteDocRef(state.studentId);
                await setDoc(voteRef, voteData);
                showModal('투표 완료!', '성공적으로 투표가 제출되었습니다. 참여해주셔서 감사합니다.', 'success');
            } catch (e) {
                console.error(e);
                showModal('오류', '저장 중 문제가 발생했습니다.', 'error');
            }
        }

        async function downloadCSV() {
            if (!currentUser) {
                showModal('권한 없음', '데이터베이스 연결이 필요합니다.', 'warning');
                return;
            }

            try {
                const querySnapshot = await getDocs(getVotesCollectionRef());
                const allVotes = [];
                querySnapshot.forEach((doc) => {
                    allVotes.push(doc.data());
                });
                
                if (allVotes.length === 0) {
                    showModal('데이터 없음', '아직 제출된 투표 데이터가 없습니다.', 'info');
                    return;
                }

                let csvContent = "\uFEFF"; 
                csvContent += "학번,이름,반별투표,개인투표1,개인투표2,개인투표3,투표시간\n";

                allVotes.forEach(vote => {
                    const row = [
                        vote.studentId,
                        vote.name,
                        vote.classVote,
                        vote.individualVotes[0] || '',
                        vote.individualVotes[1] || '',
                        vote.individualVotes[2] || '',
                        new Date(vote.timestamp).toLocaleString('ko-KR')
                    ];
                    const safeRow = row.map(item => `"${String(item).replace(/"/g, '""')}"`).join(',');
                    csvContent += safeRow + "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `벚꽃사진콘테스트_투표결과_${new Date().getTime()}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            
            } catch (e) {
                console.error(e);
                showModal('오류', '데이터를 불러오는 중 문제가 발생했습니다.', 'error');
            }
        }

        // ------------------ 모달 컨트롤 ------------------
        function showModal(title, message, type = 'info') {
            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('modalContent');
            const iconContainer = document.getElementById('modalIcon');
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;

            let iconName = 'info';
            iconContainer.className = 'mx-auto w-16 h-16 mb-4 flex items-center justify-center rounded-full';
            
            if (type === 'success') {
                iconName = 'check-circle';
                iconContainer.classList.add('bg-green-100', 'text-green-500');
            } else if (type === 'error') {
                iconName = 'x-circle';
                iconContainer.classList.add('bg-red-100', 'text-red-500');
            } else if (type === 'warning') {
                iconName = 'alert-circle';
                iconContainer.classList.add('bg-yellow-100', 'text-yellow-500');
            } else {
                iconName = 'info';
                iconContainer.classList.add('bg-cherry-100', 'text-cherry-500');
            }

            iconContainer.innerHTML = `<i data-lucide="${iconName}" class="w-8 h-8"></i>`;
            lucide.createIcons();

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        window.handleUserInfoChange = handleUserInfoChange;
        window.selectClassPhoto = selectClassPhoto;
        window.selectIndividualPhoto = selectIndividualPhoto;
        window.submitVote = submitVote;
        window.downloadCSV = downloadCSV;
        window.closeModal = closeModal;

        window.onload = initApp;

    </script>
</body>
</html>
